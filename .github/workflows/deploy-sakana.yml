name: Deploy SAKANA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "02_sakana/**"
      - ".github/workflows/deploy-sakana.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: 02_sakana
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 02_sakana/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: 02_sakana/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
